[metadata]
creation_date = "2025/01/01"
integration = ["endpoint", "windows"]
maturity = "production"
updated_date = "2026/05/04"

[rule]
author = ["Amit Ambekar / Safehouse"]
description = """
Detects credential dumping from LSASS memory using common tools and techniques including
Mimikatz, ProcDump, Task Manager, comsvcs.dll MiniDump, and direct API access.
LSASS stores NTLM hashes, Kerberos tickets, and cleartext passwords in memory.
Covers T1003.001 - OS Credential Dumping: LSASS Memory.
"""
from = "now-9m"
index = ["logs-endpoint.events.*", "winlogbeat-*", "logs-windows.sysmon_operational-*"]
language = "eql"
license = "Elastic License v2"
name = "LSASS Memory Credential Dumping via Common Tools or APIs"
references = [
  "https://attack.mitre.org/techniques/T1003/",
  "https://attack.mitre.org/techniques/T1003/001/",
  "https://www.elastic.co/security-labs/detect-credential-access",
]
risk_score = 87
rule_id = "a1b2c3d4-0007-4001-8001-000000000001"
severity = "critical"
tags = [
  "Domain: Endpoint",
  "OS: Windows",
  "Use Case: Threat Detection",
  "Tactic: Credential Access",
  "Data Source: Elastic Defend",
  "Data Source: Sysmon",
  "Resources: Investigation Guide",
]
timestamp_override = "event.ingested"
type = "eql"

query = '''
any where host.os.type == "windows" and
  (
    /* procdump targeting lsass */
    (event.category == "process" and event.type == "start" and
      process.name : ("procdump.exe", "procdump64.exe") and
      process.args : ("-ma", "-mm") and process.args : ("lsass*", "lsass.exe")
    ) or
    /* comsvcs MiniDump via rundll32 */
    (event.category == "process" and event.type == "start" and
      process.name : "rundll32.exe" and
      process.args : ("*comsvcs*", "*MiniDump*") and
      process.args : ("*lsass*")
    ) or
    /* Mimikatz sekurlsa module keywords in command line */
    (event.category == "process" and event.type == "start" and
      process.args : (
        "sekurlsa::logonpasswords", "sekurlsa::wdigest",
        "lsadump::sam", "lsadump::dcsync",
        "privilege::debug", "token::elevate"
      )
    ) or
    /* LSASS dump file creation */
    (event.category == "file" and event.type == "creation" and
      file.name : ("lsass*.dmp", "lsass*.zip", "lsass*.gz") and
      not process.name : ("WerFault.exe", "WerFaultSecure.exe")
    ) or
    /* Task Manager creating lsass dump */
    (event.category == "process" and event.type == "start" and
      process.name : "taskmgr.exe" and
      process.args : ("*lsass*")
    )
  )
'''

note = """## Triage and Analysis

### Investigating LSASS Credential Dumping

#### Possible Investigation Steps
- Identify the tool and method used to access LSASS.
- Check for dump files created on disk — preserve for forensics.
- Review network connections after the dump — look for exfiltration.
- Check for Pass-the-Hash or Pass-the-Ticket activity following the dump.

### False Positive Analysis
- Windows Error Reporting (WerFault.exe) creates legitimate LSASS dumps after crashes.
- Authorized penetration testing activity.

### Response and Remediation
- Immediately isolate the endpoint.
- Force password resets for all accounts active on the host.
- Enable Credential Guard to prevent future LSASS memory access.
- Review for lateral movement using dumped credentials.
"""

[[rule.threat]]
framework = "MITRE ATT&CK"

[[rule.threat.technique]]
id = "T1003"
name = "OS Credential Dumping"
reference = "https://attack.mitre.org/techniques/T1003/"

[[rule.threat.technique.subtechnique]]
id = "T1003.001"
name = "LSASS Memory"
reference = "https://attack.mitre.org/techniques/T1003/001/"

[[rule.threat.technique.subtechnique]]
id = "T1003.002"
name = "Security Account Manager"
reference = "https://attack.mitre.org/techniques/T1003/002/"

[rule.threat.tactic]
id = "TA0006"
name = "Credential Access"
reference = "https://attack.mitre.org/tactics/TA0006/"
