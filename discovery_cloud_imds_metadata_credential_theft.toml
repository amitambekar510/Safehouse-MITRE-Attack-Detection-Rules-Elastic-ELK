[metadata]
creation_date = "2025/01/01"
integration = ["endpoint", "linux", "aws", "azure"]
maturity = "production"
updated_date = "2026/05/04"

[rule]
author = ["Amit Ambekar / Safehouse"]
description = """
Detects access to cloud instance metadata services (IMDS) from within a cloud workload
to discover credentials, roles, or configuration data. Adversaries exploit IMDS to steal
IAM credentials or gather cloud environment details.
Also detects internal cloud service discovery via AWS CLI, Azure CLI, or GCP CLI.
Covers T1580 - Cloud Infrastructure Discovery and T1552.005 - Cloud Instance Metadata API.
"""
from = "now-9m"
index = ["logs-endpoint.events.*", "logs-system.syslog-*", "filebeat-*"]
language = "eql"
license = "Elastic License v2"
name = "Cloud Metadata Service Discovery or IMDS Credential Theft"
references = [
  "https://attack.mitre.org/techniques/T1580/",
  "https://attack.mitre.org/techniques/T1552/005/",
  "https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instancedata-data-retrieval.html",
]
risk_score = 65
rule_id = "a1b2c3d4-0009-4002-8001-000000000001"
severity = "high"
tags = [
  "Domain: Cloud",
  "Domain: Endpoint",
  "OS: Linux",
  "Use Case: Threat Detection",
  "Tactic: Discovery",
  "Tactic: Credential Access",
  "Data Source: Elastic Defend",
  "Resources: Investigation Guide",
]
timestamp_override = "event.ingested"
type = "eql"

query = '''
any where
  (
    /* Linux/Unix IMDS access via curl/wget */
    (event.category == "process" and event.type == "start" and
      host.os.type == "linux" and
      process.name : ("curl", "wget", "python*", "python3*") and
      process.args : (
        "*169.254.169.254*",       /* AWS/Azure/GCP IMDS IP */
        "*metadata.google.internal*",
        "*instance/identity/document*",
        "*latest/meta-data/iam/security-credentials*",
        "*latest/dynamic/instance-identity*"
      )
    ) or
    /* Windows IMDS access */
    (event.category == "network" and
      host.os.type == "windows" and
      destination.ip : "169.254.169.254" and
      not process.name : ("AWSLiteAgent.exe", "EC2Config.exe", "amazon-ssm-agent.exe",
                          "WindowsAzureGuestAgent.exe", "waagent", "GoogleCloudAgent*")
    ) or
    /* Cloud CLI enumeration commands */
    (event.category == "process" and event.type == "start" and
      process.name : ("aws", "az", "gcloud") and
      process.args : (
        "iam list-*", "iam get-*", "sts get-*",
        "ec2 describe-*", "s3 ls", "s3api list-*",
        "storage buckets list", "compute instances list",
        "ad signed-in-user", "account list"
      )
    )
  )
'''

note = """## Triage and Analysis

### Investigating Cloud Metadata / IMDS Access

#### Possible Investigation Steps
- Identify the process and user making the IMDS request.
- Check whether IAM credentials were retrieved and subsequently used.
- Review CloudTrail/Activity logs for API calls made with the retrieved credentials.
- Assess if the IMDS request is from an expected application or service.

### False Positive Analysis
- Cloud agent software (SSM Agent, CloudWatch Agent) legitimately queries IMDS.
- Application configuration retrieval at startup.

### Response and Remediation
- Rotate any IAM credentials exposed via IMDS.
- Enforce IMDSv2 (token-based) to prevent SSRF exploitation.
- Review all API calls made using the stolen credentials and revoke.
"""

[[rule.threat]]
framework = "MITRE ATT&CK"

[[rule.threat.technique]]
id = "T1580"
name = "Cloud Infrastructure Discovery"
reference = "https://attack.mitre.org/techniques/T1580/"

[rule.threat.tactic]
id = "TA0007"
name = "Discovery"
reference = "https://attack.mitre.org/tactics/TA0007/"

[[rule.threat]]
framework = "MITRE ATT&CK"

[[rule.threat.technique]]
id = "T1552"
name = "Unsecured Credentials"
reference = "https://attack.mitre.org/techniques/T1552/"

[[rule.threat.technique.subtechnique]]
id = "T1552.005"
name = "Cloud Instance Metadata API"
reference = "https://attack.mitre.org/techniques/T1552/005/"

[rule.threat.tactic]
id = "TA0006"
name = "Credential Access"
reference = "https://attack.mitre.org/tactics/TA0006/"
