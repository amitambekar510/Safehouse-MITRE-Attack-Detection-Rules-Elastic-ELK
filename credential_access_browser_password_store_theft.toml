[metadata]
creation_date = "2025/01/01"
integration = ["endpoint", "windows"]
maturity = "production"
updated_date = "2026/05/04"

[rule]
author = ["Amit Ambekar / Safehouse"]
description = """
Detects access to browser credential stores, password manager databases, Windows Credential
Manager, and SSH private key files by suspicious processes. Adversaries target credential
stores to harvest saved passwords for lateral movement and account takeover.
Covers T1555 - Credentials from Password Stores.
"""
from = "now-9m"
index = ["logs-endpoint.events.*", "winlogbeat-*", "logs-windows.sysmon_operational-*"]
language = "eql"
license = "Elastic License v2"
name = "Credential Theft from Browser or Password Store"
references = [
  "https://attack.mitre.org/techniques/T1555/",
  "https://attack.mitre.org/techniques/T1555/003/",
  "https://attack.mitre.org/techniques/T1555.004/",
]
risk_score = 73
rule_id = "a1b2c3d4-0007-4003-8001-000000000001"
severity = "high"
tags = [
  "Domain: Endpoint",
  "OS: Windows",
  "Use Case: Threat Detection",
  "Tactic: Credential Access",
  "Data Source: Elastic Defend",
  "Data Source: Sysmon",
  "Resources: Investigation Guide",
]
timestamp_override = "event.ingested"
type = "eql"

query = '''
file where host.os.type == "windows" and event.type in ("access", "open") and
  file.path : (
    /* Chrome/Chromium credentials */
    "?:\\Users\\*\\AppData\\Local\\Google\\Chrome\\User Data\\Default\\Login Data",
    "?:\\Users\\*\\AppData\\Local\\Google\\Chrome\\User Data\\*\\Login Data",
    /* Edge credentials */
    "?:\\Users\\*\\AppData\\Local\\Microsoft\\Edge\\User Data\\Default\\Login Data",
    /* Firefox credentials */
    "?:\\Users\\*\\AppData\\Roaming\\Mozilla\\Firefox\\Profiles\\*\\logins.json",
    "?:\\Users\\*\\AppData\\Roaming\\Mozilla\\Firefox\\Profiles\\*\\key4.db",
    /* Windows Credential Manager */
    "?:\\Users\\*\\AppData\\Local\\Microsoft\\Credentials\\*",
    "?:\\Users\\*\\AppData\\Roaming\\Microsoft\\Credentials\\*",
    /* KeePass and other password managers */
    "?:\\Users\\*\\*.kdbx",
    "?:\\Users\\*\\AppData\\Roaming\\KeePass\\*",
    /* SSH private keys */
    "?:\\Users\\*\\.ssh\\id_rsa",
    "?:\\Users\\*\\.ssh\\id_ed25519"
  ) and
  not process.name : (
    "chrome.exe", "msedge.exe", "firefox.exe", "brave.exe", "opera.exe",
    "KeePass.exe", "KeePassXC.exe", "1Password.exe",
    "SearchProtocolHost.exe", "SearchIndexer.exe"
  )
'''

note = """## Triage and Analysis

### Investigating Browser Credential Theft

#### Possible Investigation Steps
- Identify the process accessing the credential file — it should not be a browser process.
- Review what the accessing process did before and after the access.
- Check for network connections to exfiltration destinations after the access.
- Determine all accounts stored in the accessed credential store.

### False Positive Analysis
- Backup software may access user profile files including credential stores.
- Password migration tools during system transitions.

### Response and Remediation
- Force password changes for all accounts found in the accessed credential stores.
- Revoke any saved OAuth tokens.
- Enable MFA on all accessed accounts.
- Quarantine the credential-stealing process binary.
"""

[[rule.threat]]
framework = "MITRE ATT&CK"

[[rule.threat.technique]]
id = "T1555"
name = "Credentials from Password Stores"
reference = "https://attack.mitre.org/techniques/T1555/"

[[rule.threat.technique.subtechnique]]
id = "T1555.003"
name = "Credentials from Web Browsers"
reference = "https://attack.mitre.org/techniques/T1555/003/"

[[rule.threat.technique.subtechnique]]
id = "T1555.004"
name = "Windows Credential Manager"
reference = "https://attack.mitre.org/techniques/T1555/004/"

[rule.threat.tactic]
id = "TA0006"
name = "Credential Access"
reference = "https://attack.mitre.org/tactics/TA0006/"
