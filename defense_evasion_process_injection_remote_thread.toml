[metadata]
creation_date = "2025/01/01"
integration = ["endpoint", "windows"]
maturity = "production"
updated_date = "2026/05/04"

[rule]
author = ["Amit Ambekar / Safehouse"]
description = """
Detects process injection techniques including classic CreateRemoteThread injection, reflective
DLL injection, process hollowing, and shellcode injection into remote processes. Adversaries
inject code into legitimate processes to evade detection and blend in with normal activity.
Covers T1055 and sub-techniques.
"""
from = "now-9m"
index = ["logs-endpoint.events.*", "winlogbeat-*", "logs-windows.sysmon_operational-*"]
language = "eql"
license = "Elastic License v2"
name = "Process Injection - Suspicious Remote Thread Creation or Memory Allocation"
references = [
  "https://attack.mitre.org/techniques/T1055/",
  "https://attack.mitre.org/techniques/T1055/001/",
  "https://attack.mitre.org/techniques/T1055/002/",
  "https://attack.mitre.org/techniques/T1055/012/",
]
risk_score = 73
rule_id = "a1b2c3d4-0006-4001-8001-000000000001"
severity = "high"
tags = [
  "Domain: Endpoint",
  "OS: Windows",
  "Use Case: Threat Detection",
  "Tactic: Defense Evasion",
  "Tactic: Privilege Escalation",
  "Data Source: Elastic Defend",
  "Data Source: Sysmon",
  "Resources: Investigation Guide",
]
timestamp_override = "event.ingested"
type = "eql"

query = '''
sequence by process.entity_id with maxspan=1m
  /* Step 1: suspicious process opens a remote process with write+exec permissions */
  [process where host.os.type == "windows" and event.type == "start" and
    process.name : (
      "powershell.exe", "pwsh.exe", "cmd.exe", "mshta.exe",
      "wscript.exe", "cscript.exe", "regsvr32.exe", "rundll32.exe",
      "notepad.exe", "explorer.exe", "svchost.exe"
    ) and
    not process.code_signature.trusted == true
  ]
  /* Step 2: Sysmon Event ID 8 - CreateRemoteThread */
  [process where host.os.type == "windows" and event.provider == "Microsoft-Windows-Sysmon"
    and event.code == "8" and
    not winlog.event_data.TargetImage : (
      "C:\\Windows\\System32\\svchost.exe",
      "C:\\Windows\\System32\\lsass.exe"
    )
  ]
'''

note = """## Triage and Analysis

### Investigating Process Injection

#### Possible Investigation Steps
- Identify source and target processes of the injection.
- Review Sysmon Event ID 8 (CreateRemoteThread) for injection source/target.
- Check for unbacked memory regions in the target process using memory forensics.
- Look for follow-on activity: C2 connections, file drops, credential access.

### False Positive Analysis
- Security tools performing memory scanning may inject into processes.
- Some AV/EDR products use remote thread creation for monitoring hooks.

### Response and Remediation
- Terminate the injector and injected process.
- Perform memory dump and forensic analysis.
- Identify initial delivery vector and remove any droppers.
"""

[[rule.threat]]
framework = "MITRE ATT&CK"

[[rule.threat.technique]]
id = "T1055"
name = "Process Injection"
reference = "https://attack.mitre.org/techniques/T1055/"

[[rule.threat.technique.subtechnique]]
id = "T1055.001"
name = "Dynamic-link Library Injection"
reference = "https://attack.mitre.org/techniques/T1055/001/"

[[rule.threat.technique.subtechnique]]
id = "T1055.002"
name = "Portable Executable Injection"
reference = "https://attack.mitre.org/techniques/T1055/002/"

[[rule.threat.technique.subtechnique]]
id = "T1055.012"
name = "Process Hollowing"
reference = "https://attack.mitre.org/techniques/T1055/012/"

[rule.threat.tactic]
id = "TA0005"
name = "Defense Evasion"
reference = "https://attack.mitre.org/tactics/TA0005/"
