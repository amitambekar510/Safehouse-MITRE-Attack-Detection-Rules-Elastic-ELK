[metadata]
creation_date = "2025/01/01"
integration = ["endpoint", "windows", "azure", "okta"]
maturity = "production"
updated_date = "2026/05/04"

[rule]
author = ["Amit Ambekar / Safehouse"]
description = """
Detects MFA push fatigue attacks (adversary-in-the-middle MFA bombing), forced NTLM
authentication via responder/LLMNR poisoning, and keylogger-style input capture.
MFA fatigue floods a user with MFA push requests until they approve one.
Forced auth exploits LLMNR/NBT-NS/mDNS to capture NTLM hashes.
Covers T1111, T1187, T1056.001, T1040.
"""
from = "now-15m"
index = ["logs-o365.*", "logs-azure.*", "logs-okta.*", "winlogbeat-*", "logs-endpoint.events.*"]
language = "eql"
license = "Elastic License v2"
name = "Credential Access - MFA Fatigue, Forced Authentication, or LLMNR Poisoning"
references = [
  "https://attack.mitre.org/techniques/T1111/",
  "https://attack.mitre.org/techniques/T1187/",
  "https://attack.mitre.org/techniques/T1056/001/",
  "https://attack.mitre.org/techniques/T1040/",
]
risk_score = 87
rule_id = "a1b2c3d4-0007-4004-8001-000000000001"
severity = "critical"
tags = [
  "Domain: Cloud",
  "Domain: Endpoint",
  "OS: Windows",
  "Use Case: Threat Detection",
  "Tactic: Credential Access",
  "Data Source: Microsoft 365",
  "Data Source: Okta",
  "Resources: Investigation Guide",
]
timestamp_override = "event.ingested"
type = "eql"

query = '''
any where
  (
    /* MFA Fatigue: many MFA push denials from same user in short window */
    (event.dataset : ("azure.signinlogs", "okta.system", "o365.audit") and
      event.action : (
        "UserStrongAuthClientAuthN", "mfa.challenge.deny",
        "Sign-in activity", "UserLoginFailed"
      ) and
      event.outcome == "failure"
    ) or
    /* LLMNR/NBT-NS Poisoning - Responder tool indicators */
    (event.category == "process" and event.type == "start" and
      (process.name : "Responder*" or
       process.args : ("*--lm*", "*--disable-ess*", "*-I eth*", "*Responder.py*"))
    ) or
    /* Inveigh - PowerShell LLMNR poisoner */
    (event.category == "process" and event.type == "start" and
      process.name : ("powershell.exe", "pwsh.exe") and
      process.args : (
        "*Invoke-Inveigh*", "*Inveigh*", "*Get-Inveigh*",
        "*Stop-Inveigh*"
      )
    ) or
    /* Keylogger - SetWindowsHookEx or raw input hook in suspicious process */
    (event.category == "process" and event.type == "start" and
      process.name : ("powershell.exe", "pwsh.exe", "cmd.exe") and
      process.args : (
        "*SetWindowsHookEx*", "*WH_KEYBOARD*", "*WH_KEYBOARD_LL*",
        "*GetAsyncKeyState*", "*GetKeyboardState*"
      )
    )
  )
'''

note = """## Triage and Analysis

### Investigating MFA Fatigue / Forced Auth

#### Possible Investigation Steps
- For MFA fatigue: count how many push denials occurred, and verify if a push was eventually approved.
- Check source IP — does it match a known attacker location?
- For LLMNR poisoning: identify which hosts on the network were querying LLMNR/NBT-NS.
- Check for captured NTLM hashes in Responder's log files on attacker system.

### False Positive Analysis
- Legitimate users declining MFA prompts they didn't initiate (valid fatigue resistance).
- Network troubleshooting tools that may query LLMNR.

### Response and Remediation
- For MFA fatigue: disable the targeted account temporarily; contact user; reset credentials.
- Disable LLMNR and NBT-NS via Group Policy immediately.
- Enable number matching in Microsoft Authenticator to defeat push fatigue.
"""

[[rule.threat]]
framework = "MITRE ATT&CK"

