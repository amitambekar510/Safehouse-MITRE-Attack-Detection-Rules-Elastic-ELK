[metadata]
creation_date = "2025/01/01"
integration = ["windows", "system"]
maturity = "production"
updated_date = "2026/05/04"

[rule]
author = ["Amit Ambekar / Safehouse"]
description = """
Detects Kerberoasting, AS-REP Roasting, and DCSync attacks targeting Active Directory
credential material. Kerberoasting requests service tickets for service accounts to crack
offline. AS-REP Roasting targets accounts without pre-auth. DCSync mimics domain controller
replication to extract password hashes for all domain accounts.
Covers T1558, T1003.006.
"""
from = "now-9m"
index = ["winlogbeat-*", "logs-windows.forwarded*"]
language = "eql"
license = "Elastic License v2"
name = "Active Directory Credential Attack - Kerberoasting, AS-REP Roast, or DCSync"
references = [
  "https://attack.mitre.org/techniques/T1558/003/",
  "https://attack.mitre.org/techniques/T1558/004/",
  "https://attack.mitre.org/techniques/T1003/006/",
  "https://adsecurity.org/?p=1515",
]
risk_score = 87
rule_id = "a1b2c3d4-0007-4002-8001-000000000001"
severity = "critical"
tags = [
  "Domain: Endpoint",
  "Use Case: Threat Detection",
  "Tactic: Credential Access",
  "Data Source: Windows Security Event Logs",
  "Resources: Investigation Guide",
]
timestamp_override = "event.ingested"
type = "eql"

query = '''
any where host.os.type == "windows" and
  (
    /* Kerberoasting - TGS request for RC4 encrypted service ticket (0x17 = RC4) */
    (event.code == "4769" and
      winlog.event_data.TicketEncryptionType : "0x17" and
      winlog.event_data.ServiceName != "*$" and
      winlog.event_data.ServiceName != "krbtgt" and
      not winlog.event_data.IpAddress : ("127.0.0.1", "::1", "::ffff:127.0.0.1")
    ) or
    /* AS-REP Roasting - AS reply without pre-auth */
    (event.code == "4768" and
      winlog.event_data.PreAuthType == "0" and
      winlog.event_data.Status == "0x0"
    ) or
    /* DCSync - Directory Service replication rights used from non-DC */
    (event.code == "4662" and
      winlog.event_data.Properties : (
        "*1131f6aa-9c07-11d1-f79f-00c04fc2dcd2*",
        "*1131f6ad-9c07-11d1-f79f-00c04fc2dcd2*",
        "*89e95b76-444d-4c62-991a-0facbeda640c*"
      ) and
      not winlog.event_data.SubjectUserName : ("*$")
    )
  )
'''

note = """## Triage and Analysis

### Investigating Kerberoasting / DCSync

#### Possible Investigation Steps
- For Kerberoasting: identify which service accounts had tickets requested, correlate with RC4 encryption type.
- For DCSync: identify the source account and host — should only be from domain controllers.
- Check if the account was subsequently used for lateral movement or admin activity.
- Look for offline cracking indicators (password changes for service accounts).

### False Positive Analysis
- Kerberoasting detections may trigger during legitimate service connectivity testing.
- DCSync from legitimate DC replication partners.

### Response and Remediation
- Reset passwords for all targeted service accounts to 25+ character random strings.
- Enable AES-only Kerberos to prevent RC4 Kerberoasting.
- Restrict DCSync rights — only DOMAIN CONTROLLERS should have replication rights.
"""

[[rule.threat]]
framework = "MITRE ATT&CK"

[[rule.threat.technique]]
id = "T1558"
name = "Steal or Forge Kerberos Tickets"
reference = "https://attack.mitre.org/techniques/T1558/"

[[rule.threat.technique.subtechnique]]
